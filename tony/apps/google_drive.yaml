slug: google_drive
name: Google Drive
category: Productivity
description: Files and folders in Google Drive.
docs: https://developers.google.com/drive/api/reference/rest/v3
logo: https://cdn.simpleicons.org/googledrive/4285F4
verified: false
auth:
  type: oauth2
  authorize_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  scopes:
  - https://www.googleapis.com/auth/drive.readonly
  - https://www.googleapis.com/auth/drive.file
  - https://www.googleapis.com/auth/drive
  client_id_env: GOOGLE_CLIENT_ID
  client_secret_env: GOOGLE_CLIENT_SECRET
  authorize_params:
    access_type: offline
    prompt: consent
base_url: https://www.googleapis.com/drive/v3
actions:
- slug: list_files
  name: List files
  description: Recent files, newest first.
  method: GET
  url: https://www.googleapis.com/drive/v3/files
  params:
    pageSize:
      type: integer
      description: ''
      default: 20
    q:
      type: string
      description: Drive query, e.g. mimeType='application/pdf'
    fields:
      type: string
      description: ''
      default: files(id,name,mimeType,modifiedTime,size,webViewLink)
  response:
    path: files
    max_items: 30
- slug: file_info
  name: File info
  description: Metadata for one file.
  method: GET
  url: https://www.googleapis.com/drive/v3/files/{file_id}
  params:
    file_id:
      type: string
      description: ''
      required: true
      in: path
    fields:
      type: string
      description: ''
      default: id,name,mimeType,size,modifiedTime,webViewLink
  required:
  - file_id
- slug: create_folder
  name: Create folder
  description: Create a folder in Google Drive.
  method: POST
  url: https://www.googleapis.com/drive/v3/files
  tier: write
  params:
    name: {type: string, required: true}
    mimeType: {type: string, default: application/vnd.google-apps.folder}
    parents: {type: array, description: List with one parent folder id; omit for My Drive root}
  required: [name]
- slug: share_file
  name: Share file
  description: Grant another person access to a file or folder.
  method: POST
  url: https://www.googleapis.com/drive/v3/files/{file_id}/permissions
  tier: write
  params:
    file_id: {type: string, required: true, in: path}
    role: {type: string, required: true, enum: [reader, commenter, writer, owner]}
    type: {type: string, required: true, enum: [user, group, domain, anyone]}
    emailAddress: {type: string, description: Required for user or group}
    sendNotificationEmail: {type: boolean, default: true}
  required: [file_id, role, type]
  danger_note: Changes who can open the file.
