slug: calcom
name: Cal.com
category: Communication
description: Bookings and availability from Cal.com.
docs: https://cal.com/docs/api-reference
logo: https://cdn.simpleicons.org/caldotcom/292929
verified: false
auth:
  type: api_key
  header_name: Authorization
  value_template: Bearer {token}
base_url: https://api.cal.com/v2
actions:
- slug: me
  tier: read
  name: Current user
  description: Signed-in Cal.com user.
  method: GET
  url: https://api.cal.com/v2/me
- slug: list_bookings
  tier: read
  name: List bookings
  description: Bookings on the account.
  method: GET
  url: https://api.cal.com/v2/bookings
  response:
    path: data
    max_items: 25

- slug: create_booking
  tier: write
  name: Create booking
  description: Book a slot on an event type for an attendee.
  method: POST
  url: https://api.cal.com/v2/bookings
  headers:
    cal-api-version: '2024-08-13'
  params:
    start:
      type: string
      description: ISO 8601 start time in UTC, e.g. 2026-11-20T09:00:00Z
      required: true
    eventTypeId:
      type: number
      description: Numeric id of the event type to book
      required: true
    attendee:
      type: object
      description: 'Attendee, e.g. {"name":"Ada","email":"ada@example.com","timeZone":"Africa/Lagos"}'
      required: true
    metadata:
      type: object
      description: Optional extra fields required by the event type
  required:
  - start
  - eventTypeId
  - attendee
  response:
    path: data
  danger_note: Creates a real calendar booking and notifies the attendee.
