slug: cloudflare
name: Cloudflare
category: Developer
description: Zones, DNS records and account details.
docs: https://developers.cloudflare.com/api/
logo: https://cdn.simpleicons.org/cloudflare/F38020
verified: false
auth:
  type: bearer
  static_env: CLOUDFLARE_API_TOKEN
base_url: https://api.cloudflare.com/client/v4
actions:
- slug: verify_token
  name: Verify token
  description: Check that the API token is active.
  method: GET
  url: https://api.cloudflare.com/client/v4/user/tokens/verify
- slug: list_zones
  name: List zones
  description: Domains on the account.
  method: GET
  url: https://api.cloudflare.com/client/v4/zones
  params:
    per_page:
      type: integer
      description: ''
      default: 20
  response:
    path: result
    max_items: 30
- slug: list_dns
  name: List DNS records
  description: DNS records for a zone.
  method: GET
  url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records
  params:
    zone_id:
      type: string
      description: ''
      required: true
      in: path
  required:
  - zone_id
  response:
    path: result
    max_items: 40
- slug: create_dns_record
  name: Create DNS record
  description: Add a DNS record to a zone.
  method: POST
  url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records
  tier: write
  params:
    zone_id: {type: string, required: true, in: path}
    type: {type: string, required: true, description: A, AAAA, CNAME, TXT, MX}
    name: {type: string, required: true, description: "e.g. www or @ for the apex"}
    content: {type: string, required: true}
    ttl: {type: integer, default: 1, description: 1 means automatic}
    proxied: {type: boolean, default: false}
  required: [zone_id, type, name, content]
  danger_note: Changes live DNS.
