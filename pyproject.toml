[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tony-integrations"
version = "0.1.0"
description = "Open-source integration gateway: connect any app, let any agent act on it."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "MUTYINT", email = "emmanuelerogian723@gmail.com"}]
keywords = ["mcp", "integrations", "oauth", "agents", "llm", "tools"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "SQLAlchemy>=2.0",
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "cryptography>=42.0",
]

[project.urls]
Homepage = "https://github.com/emmanuelerogian723-alt/tony"
Repository = "https://github.com/emmanuelerogian723-alt/tony"

[project.scripts]
tony = "tony.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools]
packages = ["tony"]

[tool.setuptools.package-data]
tony = ["apps/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "BLE001", # blind except is deliberate at HTTP boundaries
  "S110",   # best-effort cleanup paths
  "RUF059", # tests unpack for readability
  "E501",   # server-rendered HTML/CSS lines
]
