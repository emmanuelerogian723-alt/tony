slug: zoom
name: Zoom
category: Communication
description: Meetings and recordings for a Zoom account.
docs: https://developers.zoom.us/docs/api/
logo: https://cdn.simpleicons.org/zoom/2D8CFF
verified: false
auth:
  type: oauth2
  authorize_url: https://zoom.us/oauth/authorize
  token_url: https://zoom.us/oauth/token
  scopes:
  - user:read
  - meeting:read
  client_id_env: ZOOM_CLIENT_ID
  client_secret_env: ZOOM_CLIENT_SECRET
base_url: https://api.zoom.us/v2
actions:
- slug: me
  tier: read
  name: Current user
  description: Profile of the signed-in user.
  method: GET
  url: https://api.zoom.us/v2/users/me
- slug: list_meetings
  tier: read
  name: List meetings
  description: Scheduled meetings for the user.
  method: GET
  url: https://api.zoom.us/v2/users/me/meetings
  params:
    type:
      type: string
      description: ''
      default: upcoming
  response:
    path: meetings
    max_items: 20
- slug: create_meeting
  name: Create meeting
  description: Schedule a Zoom meeting on the signed-in account.
  method: POST
  url: https://api.zoom.us/v2/users/me/meetings
  tier: write
  params:
    topic: {type: string, required: true}
    type: {type: integer, default: 2, description: 1 instant, 2 scheduled, 8 recurring}
    start_time: {type: string, description: "ISO 8601, e.g. 2026-11-12T10:00:00Z"}
    duration: {type: integer, default: 30, description: Minutes}
    timezone: {type: string, default: Africa/Lagos}
    agenda: {type: string}
  required: [topic]
  danger_note: Creates a real meeting other people can join.
