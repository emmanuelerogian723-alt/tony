<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tony connecting">
  <style>
    .r{transform-origin:32px 32px;animation:ts 1.1s cubic-bezier(.45,.05,.4,.95) infinite}
    .c{animation:tp .85s ease-in-out infinite}
    @keyframes ts{to{transform:rotate(360deg)}}
    @keyframes tp{0%,100%{opacity:.45}50%{opacity:1}}
  </style>
  <path d="M11.5 32h6.5" stroke="#F3F0E9" stroke-width="5" stroke-linecap="round"/>
  <circle class="r" cx="32" cy="32" r="13" fill="none" stroke="#F3F0E9" stroke-width="5"
          stroke-dasharray="30 22" stroke-linecap="round"/>
  <circle class="c" cx="33.5" cy="30.5" r="4.6" fill="#E2542B"/>
</svg>