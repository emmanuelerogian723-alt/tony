slug: tiktok
name: TikTok
category: Social
verified: false
description: TikTok profile data and video lists for a signed-in creator, plus trending discovery through the open web.
docs: https://developers.tiktok.com/doc/login-kit-web
logo: https://cdn.simpleicons.org/tiktok/000000
base_url: https://open.tiktokapis.com/v2
auth:
  type: oauth2
  authorize_url: https://www.tiktok.com/v2/auth/authorize/
  token_url: https://open.tiktokapis.com/v2/oauth/token/
  scopes: [user.info.basic, video.list]
  client_id_env: TIKTOK_CLIENT_ID
  client_secret_env: TIKTOK_CLIENT_SECRET
  authorize_params: {response_type: code}
actions:
  - slug: profile
    name: Creator profile
    description: Display name, avatar, follower count and bio for the connected creator.
    method: GET
    url: https://open.tiktokapis.com/v2/user/info/
    params:
      fields: {type: string, default: "open_id,union_id,avatar_url,display_name,bio_description,is_verified,follower_count,following_count,likes_count,video_count"}
  - slug: list_videos
    name: List videos
    description: The creator's recent videos with captions, views, likes and shares.
    method: POST
    url: https://open.tiktokapis.com/v2/video/list/
    params:
      max_count: {type: integer, default: 10, maximum: 20}
      cursor: {type: integer}
      fields: {type: string, default: "id,title,video_description,duration,cover_image_url,share_url,view_count,like_count,comment_count,share_count,create_time"}
    response:
      path: data.videos
      max_items: 20
  - slug: video_info
    public: true
    name: Video info (no login)
    description: Real metadata for any TikTok video URL — title, author, thumbnail and embed. Uses TikTok oEmbed, so no developer account is needed.
    method: GET
    url: https://www.tiktok.com/oembed
    params:
      url: {type: string, required: true, description: "Full TikTok video URL"}
    required: [url]
    response:
      max_chars: 6000
    notes: Public oEmbed endpoint; no key required.
  - slug: trending
    public: true
    name: Trending on TikTok now
    description: What people are currently posting about on TikTok — pulled live from trending hashtags, sounds and videos in the news and creator ecosystem. Returns titles, links and snippets.
    method: GET
    url: https://news.google.com/rss/search
    params:
      q: {type: string, default: "tiktok trending hashtags today", description: "Search query"}
    required: [q]
    response:
      transform: search
      max_items: 12
      max_chars: 8000
    headers:
      Accept: text/html
    notes: TikTok's own trend API is partner-only, so this reads the live trend conversation instead. Connect a TikTok account for first-party creator data.
