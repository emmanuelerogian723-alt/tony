slug: binance
name: Binance
description: Public market data for crypto pairs. No key, no account, no rate-limit games.
category: Finance
auth:
  type: none
base_url: https://api.binance.com
actions:
- slug: price
  tier: read
  name: Price
  description: Latest price for one trading pair, e.g. BTCUSDT.
  method: GET
  path: /api/v3/ticker/price
  params:
    symbol:
      type: string
      description: Pair symbol, uppercase, e.g. BTCUSDT or ETHUSDT
      default: BTCUSDT
- slug: ticker
  tier: read
  name: 24h stats
  description: 24-hour change, high, low and volume for a pair.
  method: GET
  path: /api/v3/ticker/24hr
  params:
    symbol:
      type: string
      description: Pair symbol, e.g. BTCUSDT
      default: BTCUSDT
- slug: prices_all
  tier: read
  name: All prices
  description: Every tracked pair and its latest price.
  method: GET
  path: /api/v3/ticker/price
