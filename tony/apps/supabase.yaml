slug: supabase
name: Supabase
category: Developer
description: Projects and organisations on Supabase.
docs: https://supabase.com/docs/reference/api/introduction
logo: https://cdn.simpleicons.org/supabase/3FCF8E
verified: false
auth:
  type: bearer
  static_env: SUPABASE_ACCESS_TOKEN
base_url: https://api.supabase.com/v1
actions:
- slug: list_projects
  tier: read
  name: List projects
  description: All Supabase projects.
  method: GET
  url: https://api.supabase.com/v1/projects
  response:
    max_items: 30
- slug: list_organizations
  tier: read
  name: List organisations
  description: Organisations for this token.
  method: GET
  url: https://api.supabase.com/v1/organizations
  response:
    max_items: 20
- slug: create_project
  name: Create project
  description: Create a new Supabase project in an organization.
  method: POST
  url: https://api.supabase.com/v1/projects
  tier: write
  params:
    name: {type: string, required: true}
    organization_id: {type: string, required: true}
    region: {type: string, default: eu-west-1}
    db_pass: {type: string, required: true, description: Strong database password}
    plan: {type: string, default: free}
  required: [name, organization_id, db_pass]
  danger_note: Provisions a real billable project.
